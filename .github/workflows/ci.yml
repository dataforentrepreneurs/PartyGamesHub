name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # 1. Frontends Build Checks
  build-frontends:
    name: Build & Verify Frontends
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Use Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Build DrawJudge Frontend
      run: |
        cd Games/DrawJudge
        npm install
        npm run build

    - name: Build CoupleClash Frontend
      run: |
        cd Games/CoupleClash
        npm install
        npm run build

    - name: Build Launcher Frontend
      run: |
        cd Games/Launcher
        npm install
        npm run build

    - name: Verify Distribution Directories
      run: |
        test -f Games/DrawJudge/dist/index.html || { echo "DrawJudge build missing"; exit 1; }
        test -f Games/CoupleClash/dist/index.html || { echo "CoupleClash build missing"; exit 1; }
        test -f Games/Launcher/dist/index.html || { echo "Launcher build missing"; exit 1; }
        echo "All game builds verified successfully!"

  # 2. Backend Checks
  check-backend:
    name: Install & Verify Backend
    runs-on: ubuntu-latest
        
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: 'Server/requirements.txt'
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r Server/requirements.txt
        
    - name: Check Python Syntax
      run: |
        python -m compileall Server
